name: release

# Tag-driven release pipeline. The intended operator flow is:
#
#     git tag vX.Y.Z && git push origin vX.Y.Z
#
# Everything else fires automatically:
#
#   1. test          — matrix pytest. Must pass or the pipeline halts;
#                      nothing is published until tests are green on the
#                      tagged commit.
#   2. build         — wheel + sdist, uploaded as workflow artifact.
#   3. publish       — PyPI via OIDC trusted publisher.
#   4. release       — GitHub Release with CHANGELOG notes + artifacts.
#   5. sync-main     — open a develop→main PR (normal CI/review gating,
#                      never merged by this pipeline) so main can follow
#                      the latest released commit. Skipped
#                      if main already matches.
#
# Manual re-run: the workflow also accepts a `version` input via
# workflow_dispatch so you can re-publish without re-tagging.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to publish (e.g. v0.10.19) — must already exist on the repo'
        required: true
        type: string

jobs:
  test:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","X64","scitex-ci"]') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      # Owned ephemeral PostgreSQL for the store-backed index suite:
      # postgres:16 with the same credentials/port/health contract as
      # the canonical org reusable. Throwaway cluster for this job.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scitex
          POSTGRES_PASSWORD: scitex
          POSTGRES_DB: scitex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scitex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${GITHUB_REF#refs/tags/}"
          else
            v="${{ inputs.version }}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.version }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: ${{ matrix.python-version }}
      - name: Qualify the requested interpreter
        run: |
          test -x "${{ steps.setup-python.outputs.python-path }}" || {
            echo "::error::setup-python produced no executable for requested ${{ matrix.python-version }}."
            exit 1
          }
          "${{ steps.setup-python.outputs.python-path }}" -c "import sys; want=tuple(int(part) for part in '${{ matrix.python-version }}'.split('.')); assert sys.version_info[:2] == want, sys.version"
          printf '%s\n' "SETUP_PYTHON=${{ steps.setup-python.outputs.python-path }}" >> "$GITHUB_ENV"
      - name: Install (required full test profile)
        run: |
          "$SETUP_PYTHON" -m pip install --upgrade pip
          "$SETUP_PYTHON" -m pip install -e ".[all,dev]"
      - name: Point the store at the ephemeral service
        run: |
          printf '%s\n' "SCITEX_STORE_DSN=postgresql://scitex:scitex@127.0.0.1:5432/scitex" >> "$GITHUB_ENV"
      - name: Run pytest against the verified job store
        # ONE genuine writable_dsn context spans the actual pytest
        # subprocess: the resolved DSN must equal the explicitly
        # exported job-owned SCITEX_STORE_DSN (fail closed on fallback
        # or mismatch). The context stays open until the subprocess
        # result is collected, and nonzero propagates. tests/ is
        # asserted present first. No fixture or assertion is edited;
        # the DSN value itself is never printed.
        run: |
          test -d tests
          "$SETUP_PYTHON" - <<'PYTHON'
          import os
          import subprocess
          import sys
          from contextlib import ExitStack
          from scitex_dev.store.testing import writable_dsn
          expected = os.environ["SCITEX_STORE_DSN"]
          with ExitStack() as stack:
              dsn = stack.enter_context(writable_dsn())
              assert dsn == expected, "store DSN is not the job-owned service"
              print("writable job store verified")
              proc = subprocess.run([sys.executable, "-m", "pytest", "tests/", "-x"])
          sys.exit(proc.returncode)
          PYTHON

  build:
    needs: test
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","X64","scitex-ci"]') }}
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${GITHUB_REF#refs/tags/}"
          else
            v="${{ inputs.version }}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.version }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: "3.12"
      - name: Qualify the requested interpreter
        run: |
          test -x "${{ steps.setup-python.outputs.python-path }}" || {
            echo "::error::setup-python produced no executable for requested 3.12."
            exit 1
          }
          "${{ steps.setup-python.outputs.python-path }}" -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"
          printf '%s\n' "SETUP_PYTHON=${{ steps.setup-python.outputs.python-path }}" >> "$GITHUB_ENV"
      - name: Install build tools
        run: "\"$SETUP_PYTHON\" -m pip install build"
      - name: Build distribution
        run: "\"$SETUP_PYTHON\" -m build"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","X64","scitex-ci"]') }}
    environment:
      name: pypi
      url: https://pypi.org/p/scitex-dataset
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: [build, publish]
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","X64","scitex-ci"]') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.version }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          VERSION="${VERSION#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {p=1; next}
            p && /^## \[/ {exit}
            p
          ' CHANGELOG.md > release-notes.md || true
          if [ ! -s release-notes.md ]; then
            echo "Release v${VERSION}. See CHANGELOG.md for details." > release-notes.md
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.build.outputs.version }}" \
            --title "${{ needs.build.outputs.version }}" \
            --notes-file release-notes.md \
            dist/*

  sync-main:
    # Open develop→main PR so main can follow the latest released
    # commit. Branch-protected mains require PR review; this job never
    # merges — the PR stays open for normal CI review gating.
    needs: publish
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","X64","scitex-ci"]') }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop
      - name: Open develop→main PR if diverged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git fetch origin main
          AHEAD=$(git rev-list --count origin/main..origin/develop)
          if [ "$AHEAD" -eq 0 ]; then
            echo "main already up-to-date with develop."
            exit 0
          fi
          EXISTING=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // empty')
          if [ -z "$EXISTING" ]; then
            PR_URL=$(gh pr create --base main --head develop \
              --title "release: sync main with develop" \
              --body "Auto-opened by the release pipeline so main equals the latest released commit.")
            EXISTING=$(echo "$PR_URL" | grep -oE '[0-9]+$')
            echo "Created PR #${EXISTING}"
          else
            echo "Reusing existing PR #${EXISTING}"
          fi
          echo "PR #${EXISTING} left open for normal CI review gating; no admin merge in this pipeline."
