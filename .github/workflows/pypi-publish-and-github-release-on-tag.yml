name: release

# Tag-driven release pipeline. The intended operator flow is:
#
#     git tag vX.Y.Z && git push origin vX.Y.Z
#
# Everything else fires automatically:
#
#   1. test          — matrix pytest. Must pass or the pipeline halts;
#                      nothing is published until tests are green on the
#                      tagged commit.
#   2. build         — wheel + sdist, uploaded as workflow artifact.
#   3. publish       — PyPI via OIDC trusted publisher.
#   4. release       — GitHub Release with CHANGELOG notes + artifacts.
#   5. sync-main     — open or reuse a develop→main PR for normal
#                      checks and review. Never merge it from this job.
#                      Skipped if main already matches.
#
# Manual dispatch accepts an existing version tag. Input is passed as data,
# never shell source. This syntax guard does not qualify a release artifact.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to publish (e.g. v0.10.19) — must already exist on the repo'
        required: true
        type: string

jobs:
  test:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","X64","scitex-ci"]') }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scitex
          POSTGRES_PASSWORD: scitex
          POSTGRES_DB: scitex
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U scitex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Resolve version
        id: ver
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          REQUESTED_RELEASE_TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_EVENT" = "push" ]; then
            [[ "$GITHUB_REF" == refs/tags/* ]] || exit 1
            v="${GITHUB_REF#refs/tags/}"
          elif [ "$RELEASE_EVENT" = "workflow_dispatch" ]; then
            v="$REQUESTED_RELEASE_TAG"
          else
            exit 1
          fi
          [[ "$v" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo '::error::Release requires an existing vX.Y.Z tag' >&2
            exit 1
          }
          printf 'version=%s\n' "$v" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.ver.outputs.version }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify release version and checkout
        env:
          RELEASE_TAG: ${{ steps.ver.outputs.version }}
        run: python .github/ci/check_release_version.py --tag "$RELEASE_TAG"
      - uses: astral-sh/setup-uv@v7
      - name: Point the store at the owned service
        env:
          POSTGRES_SERVICE_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          set -euo pipefail
          if ! [[ "${POSTGRES_SERVICE_PORT:-}" =~ ^[1-9][0-9]{0,4}$ ]] || (( POSTGRES_SERVICE_PORT > 65535 )); then
            echo '::error::Release PostgreSQL has no valid allocated port.' >&2
            exit 1
          fi
          printf 'SCITEX_STORE_DSN=postgresql://scitex:scitex@127.0.0.1:%s/scitex\n' "$POSTGRES_SERVICE_PORT" >> "$GITHUB_ENV"
      - name: Install the complete test profile
        env:
          RELEASE_TEST_PYTHON: ${{ matrix.python-version }}
        run: |
          set -euo pipefail
          uv venv --python "$RELEASE_TEST_PYTHON" .venv
          uv pip install --python .venv/bin/python -e ".[all,dev]"
          uv pip check --python .venv/bin/python
      - name: Run pytest
        run: |
          set -euo pipefail
          test -d tests
          .venv/bin/python -m pytest tests/ -x

  build:
    needs: test
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","X64","scitex-ci"]') }}
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Resolve version
        id: ver
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          REQUESTED_RELEASE_TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_EVENT" = "push" ]; then
            [[ "$GITHUB_REF" == refs/tags/* ]] || exit 1
            v="${GITHUB_REF#refs/tags/}"
          elif [ "$RELEASE_EVENT" = "workflow_dispatch" ]; then
            v="$REQUESTED_RELEASE_TAG"
          else
            exit 1
          fi
          [[ "$v" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo '::error::Release requires an existing vX.Y.Z tag' >&2
            exit 1
          }
          printf 'version=%s\n' "$v" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.ver.outputs.version }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify release version and checkout
        env:
          RELEASE_TAG: ${{ steps.ver.outputs.version }}
        run: python .github/ci/check_release_version.py --tag "$RELEASE_TAG"
      - uses: astral-sh/setup-uv@v7
      - name: Install build tools
        run: |
          set -euo pipefail
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python build
      - name: Build distribution
        run: .venv/bin/python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","X64","scitex-ci"]') }}
    environment:
      name: pypi
      url: https://pypi.org/p/scitex-dataset
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: [build, publish]
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","X64","scitex-ci"]') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.build.outputs.version }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          VERSION="${VERSION#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {p=1; next}
            p && /^## \[/ {exit}
            p
          ' CHANGELOG.md > release-notes.md || true
          if [ ! -s release-notes.md ]; then
            echo "Release v${VERSION}. See CHANGELOG.md for details." > release-notes.md
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.build.outputs.version }}" \
            --title "${{ needs.build.outputs.version }}" \
            --notes-file release-notes.md \
            dist/*

  sync-main:
    # Open or reuse a develop→main PR. Normal checks and review govern
    # its later merge; this job never bypasses branch protection.
    needs: publish
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","X64","scitex-ci"]') }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop
      - name: Open develop→main PR if diverged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git fetch origin main
          AHEAD=$(git rev-list --count origin/main..origin/develop)
          if [ "$AHEAD" -eq 0 ]; then
            echo "main already up-to-date with develop."
            exit 0
          fi
          EXISTING=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // empty')
          if [ -z "$EXISTING" ]; then
            PR_URL=$(gh pr create --base main --head develop \
              --title "release: sync main with develop" \
              --body "Auto-opened by the release pipeline so main equals the latest released commit.")
            EXISTING=$(echo "$PR_URL" | grep -oE '[0-9]+$')
            echo "Created PR #${EXISTING}"
          else
            echo "Reusing existing PR #${EXISTING}"
          fi
          echo "PR #${EXISTING} remains open for normal checks and review."
